<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberShield AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="CyberShield AI Logo">

            <span>CyberShield AI</span>
        </div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/login" class="active">Login</a></li>
            <li><a href="/register" class="nav-register">Register</a></li>
        </ul>

    </nav>


    <!-- LOGIN SECTION -->
    <section class="login-page">

        <div class="login-card">

            <!-- LOGO -->
            <div class="login-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="CyberShield AI">
            </div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your CyberShield AI account
            </p>


            <!-- LOGIN FORM -->
            <form method="POST" action="/login">

                <div class="input-box">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-box">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="form-btn">
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->
            <div class="extra-links">

                <p>
                    Don't have an account?
                    <a href="/register">Create Account</a>
                </p>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 CyberShield AI. All Rights Reserved.
            </p>

        </div>

    </footer>

</body>
</html>
