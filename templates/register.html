<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CyberShield AI</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar">

        <div class="logo">

            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="CyberShield AI Logo">

            <span>CyberShield AI</span>

        </div>


        <ul class="nav-links">

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/about">About</a>
            </li>

            <li>
                <a href="/login">Login</a>
            </li>

            <li>
                <a href="/register" class="nav-register active">
                    Register
                </a>
            </li>

        </ul>

    </nav>


    <!-- ==================== REGISTER SECTION ==================== -->

    <section class="register-page">

        <div class="register-card">

            <!-- Logo -->

            <div class="register-logo">

                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="CyberShield AI">

            </div>


            <!-- Heading -->

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Join CyberShield AI and protect yourself from phishing websites
            </p>


            <!-- ==================== REGISTER FORM ==================== -->

            <form method="POST" action="/register">


                <!-- Full Name -->

                <div class="input-box">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-box">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-box">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Register Button -->

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <div class="extra-links">

                <p>
                    Already have an account?

                    <a href="/login">
                        Login Here
                    </a>
                </p>

            </div>

        </div>

    </section>


    <!-- ==================== FOOTER ==================== -->

    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 CyberShield AI. All Rights Reserved.
            </p>

        </div>

    </footer>

</body>

</html>
